apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_ADDRESS
              value: 0.0.0.0
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: team,mysql
            - name: SPRING_SQL_INIT_MODE
              value: always
            - name: SPRING_SQL_INIT_SCHEMA_LOCATIONS
              value: classpath:schema-mysql.sql
            - name: MYSQL_HOST
              value: order-db
            - name: MYSQL_USERNAME
              value: order_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-credentials
                  key: password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orderandgo-internal
                  key: api-key
            - name: USER_SERVICE_URL
              value: http://user-service:8080
            - name: MENU_SERVICE_URL
              value: http://menu-service:8080
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8080
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8080
            - name: APP_ALLOW_TEST_PAYMENT
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
