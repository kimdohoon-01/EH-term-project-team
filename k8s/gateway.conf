server {
    listen 8080;
    absolute_redirect off;

    location = /healthz { return 200 "ok\n"; }
    location = /menu { return 308 /menu/; }

    location = / {
        proxy_pass http://order-service:8080;
    }
    location ~ ^/(app\.js|style\.css)$ {
        proxy_pass http://order-service:8080;
    }
    location /shop/api/ {
        proxy_pass http://order-service:8080;
    }
    location ~ ^/api/(auth|orders|notifications|config)(/|$) {
        proxy_pass http://order-service:8080;
    }

    location /menu/ {
        proxy_pass http://menu-service:8080/;
    }
    location = /api/menus/events {
        proxy_pass http://menu-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location ~ ^/api/(menus|stock)(/|$) {
        proxy_pass http://menu-service:8080;
    }
    location ~ ^/api/payments(/|$) {
        proxy_pass http://payment-service:8080;
    }
    location / { return 404; }
}
