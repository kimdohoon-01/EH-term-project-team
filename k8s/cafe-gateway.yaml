apiVersion: v1
kind: Service
metadata:
  name: cafe-gateway
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: cafe-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-gateway-nodeport
spec:
  type: NodePort
  selector:
    app: cafe-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafe-gateway
  template:
    metadata:
      labels:
        app: cafe-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cafe-gateway
