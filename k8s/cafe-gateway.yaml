apiVersion: v1
kind: ConfigMap
metadata:
  name: cafe-gateway
data:
  default.conf: |
    server {
        listen 8080;
        absolute_redirect off;

        location = /healthz { return 200 "ok\n"; }
        location = / { return 302 /menu/; }
        location = /menu { return 308 /menu/; }
        location / { return 404; }

        location /menu/ {
            proxy_pass http://menu-service:8080/;
        }
        location ~ ^/api/(menus|stock)(/|$) {
            proxy_pass http://menu-service:8080;
        }
        location ~ ^/api/payments(/|$) {
            proxy_pass http://payment-service:8080;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-gateway
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: cafe-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cafe-gateway-nodeport
spec:
  type: NodePort
  selector:
    app: cafe-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cafe-gateway
  template:
    metadata:
      labels:
        app: cafe-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cafe-gateway
